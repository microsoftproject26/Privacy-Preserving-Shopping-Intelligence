# Proposed execution defaults, not a record of a completed run.
# MASTER_PROMPT.md is authoritative if a key requires detailed interpretation.
schema_version: rees46_next_item_context_eda_v3
execution:
  scope: data_only
  process_full_sources: true
  train_recommenders: false
  train_ml_imputers: false
  download_filled_dataset: false
  network_uploads: false
  git_mutations: false
  overwrite_raw: false
  human_review_before_training: true
  run_lock: true
  retry_limit_same_failure: 3
  output_root: next_item_eda
  source_search_scope: supplied_workspace_only
resources:
  engine_preference: duckdb_pyarrow
  engine_fallback: polars_external
  memory_fraction_available: 0.50
  pandas_use: aggregate_tables_only
  full_data_sampling_fallback: false
  sensitivity_max_users: 100000
  sampling_seed: 20260921
  row_group_target_mib: [128, 512]
splits:
  timezone: UTC
  intervals_half_open: true
  TRAIN: ['2019-10-01T00:00:00Z', '2019-11-16T00:00:00Z']
  VALIDATION_SELECT: ['2019-11-16T00:00:00Z', '2019-11-20T00:00:00Z']
  VALIDATION_CONFIRM: ['2019-11-20T00:00:00Z', '2019-11-23T00:00:00Z']
  TEST: ['2019-11-23T00:00:00Z', '2019-11-30T00:00:00Z']
  LABEL_GRACE: ['2019-11-30T00:00:00Z', '2019-12-01T00:00:00Z']
  test_access: logged_deterministic_build_and_fixed_gates_only
  test_exploratory_report: sealed
  refit_on_validation: false
raw:
  id_type: exact_string
  retain_all_event_types_in_canonical: true
  next_item_event_type: view
  event_id_basis: [source_file_sha256, logical_csv_record_ordinal]
  payload_duplicates: retain_unless_proven_duplicate_ingestion
  invalid_product_known_user_time: sequence_barrier
  invalid_time: evidence_bounded_uncertainty_or_block
  future_quality_flags_must_not_change_train_population: true
metadata:
  preserve_originals: true
  primary_mode: validated_asof_exact_recovery
  evidence_events: original_valid_views_only
  product_mapping_unique_known_values: 1
  product_mapping_min_distinct_prior_timestamps: 2
  category_code_mapping_unique_known_values: 1
  category_code_mapping_min_distinct_prior_products: 3
  use_category_to_brand_mapping: false
  use_global_mode: false
  use_future_backfill: false
  allow_recovered_values_as_new_evidence: false
  simultaneous_events: snapshot_before_timestamp_then_update
  future_partition_global_map: frozen_end_of_train
  validation_cutoffs: ['2019-10-25T00:00:00Z', '2019-11-01T00:00:00Z', '2019-11-08T00:00:00Z']
  validation_min_independent_products: 500
  validation_confidence_level: 0.95
  validation_wilson_accuracy_lower_bound: 0.99
  validation_support_unit: one_predetermined_prediction_per_product
  whole_product_masking_diagnostic: true
  failed_family_fallback: original_plus_missing
  remaining_missing_is_blocker: false
sessions:
  raw_session_role: audit_only
  gap_seconds: 3600
  new_session_when: strictly_greater
  gap_computed_before_repeat_compression: true
  time_zone_conversion: none_utc
  split_on_main_category_change: false
  category_switch_states: [SAME, CHANGED, UNKNOWN]
  sensitivity_gaps_seconds: [1800, 3600, 7200]
  category_split_sensitivity: diagnostic_only
  different_products_same_timestamp: ambiguity_barrier
  preserve_behavioral_and_model_segment_ids_separately: true
  reset_model_segment_at_partition_fence: true
repeats:
  policy: consecutive_raw_product_keep_first
  dedup_again_after_oov_encoding: false
  final_run_count_as_predictor: false
  future_repeat_span_as_predictor: false
targets:
  task: next_different_observed_viewed_item
  construct_before_catalogue_filter: true
  relink_after_filtering: false
  strict_later_target_time: true
  train_target_requires_same_partition: true
  grace_can_label_existing_test_decisions_only: true
  train_oov_target: loss_mask_false
  evaluation_oov_target: retain_e2e_zero
  no_observed_target: unscored_explicit_reason
catalogue:
  fit_scope: full_valid_train_population
  rule: one_pass_representative_view_support
  minimum_support: 5
  singleton_representatives_count_for_item_support: true
  output_classes: real_catalogue_items_only
  filter_seen_items_at_evaluation: false
  evaluation_ranking: full_catalogue_chunked
population:
  main: all_available_valid_train_users
  future_presence_filter: false
  purchase_filter: false
  activity_cap: null
  raw_user_id_default_predictor: false
  user_identity_for_context_and_clients: true
categorical_tokens:
  PAD: 0
  MISSING: 1
  OOV: 2
  KNOWN_START: 3
  item_missing_is_valid_event: false
features:
  categorical_primary: [product_id, category_id_resolved, brand_resolved, main_category_resolved]
  full_category_code: stored_optional_selector
  price: log1p_nonnegative_plus_missing_zero_flags
  time: [utc_hour_sin, utc_hour_cos, utc_weekday_sin, utc_weekday_cos, log_previous_raw_view_gap, log_segment_elapsed, observed_item_age]
  numeric_fit_scope: TRAIN
  numeric_clip_quantiles: [0.001, 0.999]
  numeric_imputation: zero_after_normalization_plus_missing_indicator
  user_context_window_previous_representatives: 100
  user_state_future_partition_seed: end_of_train_independently_per_partition
  user_state_update: earlier_observed_events_within_partition_only
  session_context: prefix_only
  learned_user_embedding_required: false
  learned_session_uuid_embedding: false
  relative_category_price_required: false
loaders:
  representation: shared_features_lazy_windows
  supervised_unit: one_final_target_per_decision
  keep_complete_sequences: true
  context_length_candidates: [20, 50]
  context_default_rule: use_20_if_train_full_prefix_coverage_at_least_0.95_else_50
  padding: right
  position_ids: one_to_length_then_zero
  gru_controlled_history: zero_initialized_bounded_window
  sasrec_mask: causal_and_padding
  target_in_input: false
  compare_all_logical_decision_ids_and_targets: true
readiness:
  allowed_states: [READY, READY_WITH_WARNINGS, BLOCKED]
  execute_notebook: true
  export_html: true
  require_fresh_kernel: true
  require_raw_hash_verification: true
  require_zero_blocking_invariants_failed: true
  source_references_unavailable: warning
  secondary_sampled_charts: warning
  unknown_historical_holdout_status: separate_research_status_not_fabricated
  no_model_training_until_human_review: true
