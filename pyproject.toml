[build-system]
# setuptools reads the package map below. 84.0.0 is the version on the A40 server
# (environment/ENV_PKGS_A40.txt).
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-preserving-shopping-intelligence"
version = "0.1.0"
description = "Privacy-Preserving Shopping Intelligence via Federated and On-Device Learning"
requires-python = "==3.11.14"

dependencies = [
    "flwr[simulation]==1.33.0",
    "lightgbm==4.7.0",
    # Added with run_pipeline.py --from-results: the stage figures (PNG + PDF) are drawn with
    # matplotlib alone (no seaborn); it never touches a computed number, it only renders the
    # curated result files.
    "matplotlib==3.11.2",
    # Added by S2-SE-01. The export path needs the checker to validate the graph and
    # the runtime to prove the exported model produces the same numbers as PyTorch.
    # Parity that is not executed in the deployment runtime is not parity.
    "onnx==1.20.0",
    "onnxruntime==1.24.1",
    # Added by S2-DS-01. The rest of the package uses polars; the model lane's window
    # builder, evaluator and REES46 loader are pandas, and they reproduce the upstream
    # S1-D1-DS-07 baselines to four decimal places. Rewriting verified numeric code to
    # avoid a dependency is how this project has produced most of its defects, so the
    # dependency is declared instead.
    "pandas==3.0.5",
    "polars==1.43.2",
    "psutil==7.2.2",
    "pyarrow==21.0.0",
    "ray==2.55.1",
    "scikit-learn==1.9.0",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true

[tool.ruff.lint.isort]
# The prototype packages. Before the stage layout they sat at the repository root, which is
# how ruff recognised them as first-party; they now live in the stage folders.
known-first-party = ["ppsi", "ppsi_paths", "scripts"]

[tool.ruff.lint.per-file-ignores]
# Research code and its tests are byte-identical to the reviewed server copies, and their
# hashes are pinned (code identities, TEST locks, SNAPSHOT_MANIFEST.json, review receipts).
# A style fix would break those pins, so ruff only parses them: syntax errors still fail.
# The folders carry descriptive names (ppsi_paths.FOLDER_NAMES maps them to the import names).
"0*/code/*.py" = ["ALL"]
"0*/code/baselines/**" = ["ALL"]
"0*/code/benchmark_converters/**" = ["ALL"]
"0*/code/benchmark_runner/**" = ["ALL"]
"0*/code/central_trainer/**" = ["ALL"]
"0*/code/closure_experiments/**" = ["ALL"]
"0*/code/data_census/**" = ["ALL"]
"0*/code/dataset_builder/**" = ["ALL"]
"0*/code/dataset_manifests_v2/**" = ["ALL"]
"0*/code/evaluator/**" = ["ALL"]
"0*/code/export_feasibility_check/**" = ["ALL"]
"0*/code/feature_search/**" = ["ALL"]
"0*/code/feature_search_samples/**" = ["ALL"]
"0*/code/federated_core/**" = ["ALL"]
"0*/code/history_policy/**" = ["ALL"]
"0*/code/model_variants/**" = ["ALL"]
"0*/code/onnx_device_protocol/**" = ["ALL"]
"0*/code/pilot_code_snapshot/**" = ["ALL"]
"0*/code/pretraining_manifest/**" = ["ALL"]
"0*/code/run_supervisor/**" = ["ALL"]
"0*/code/study_launchers/**" = ["ALL"]
"0*/code/tau_fixed_reruns/**" = ["ALL"]
"0*/code/test_manifests/**" = ["ALL"]
"0*/code/training_manifest_full/**" = ["ALL"]
"0*/code/truncated_history_features/**" = ["ALL"]
"0*/code/update_leakage_audit/**" = ["ALL"]
"0*/scripts/tau_fixed_reruns/**" = ["ALL"]
"0*/tests/research/**" = ["ALL"]

# One `uv sync` (or `pip install -e .`) installs the code of every stage under its old import
# name: `from v4data import ...`, `from fl import ...` and `from ppsi.fedsim import ...` keep
# working, because the map points each import name at its descriptive stage folder
# (ppsi_paths.FOLDER_NAMES is the old-name -> folder-name mapping). setuptools needs the map to
# be static, so it is generated from the stage folders:
#     uv run python tools/list_packages.py --write    (then `uv lock`)
# `tools/check.py` and CI fail when it is out of date. Script folders without `__init__.py`
# (export_feasibility_check, tau_fixed_reruns), the g0_*.py scripts and the snapshot
# pilot_code_snapshot are run by path and not installed.
# BEGIN generated by tools/list_packages.py: do not edit by hand
