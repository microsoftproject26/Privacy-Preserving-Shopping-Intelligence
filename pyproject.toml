[tool.pytest.ini_options]
# The prototype test suites, one per stage. The research suites in <stage>/tests/research
# carry their own pytest.ini and run_all.py and need the server data; run them from their
# folder.
testpaths = [
    "00_common/tests/prototype",
    "01_data/tests/prototype",
    "02_centralized/tests/prototype",
    "03_federated_learning/tests/prototype",
    "04_on_device/tests/prototype",
    "05_privacy_and_security/tests/prototype",
    "06_evaluation_and_benchmarks/tests/prototype",
]
# prepend (pytest's default), set explicitly: the prototype tests import their sibling test kits
# by name (`from seqrec_testkit import ...`, `from test_schemas import ...`), which importlib mode
# cannot do because it leaves sys.path alone. Every test file name is unique across the stage
# folders; a duplicate stops collection with "import file mismatch" instead of running the wrong
# module. The experiment_extensions tests in the stage code folders are not collected here.
addopts = ["--import-mode=prepend"]
# A hung Ray or Flower simulation fails its test instead of the whole CI job; the end-to-end
# benchmark-pipeline tests need well over 15 minutes on a busy machine.
timeout = 3600
